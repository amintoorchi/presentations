<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark light" />
        <title>Presentation title</title>
        <style>
            :root {
                --mono:
                    ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco,
                    Consolas, "Liberation Mono", monospace;
                --bg: #0b0c0f;
                --fg: #f2f0e8;
                --muted: #989ba3;
                --accent: #e8c14a;
                --line: rgba(232, 193, 74, 0.35);
                --shadow: rgba(0, 0, 0, 0.65);
            }

            :root[data-theme="light"] {
                --bg: #f7f3e9;
                --fg: #28231c;
                --muted: #70695e;
                --accent: #a15c00;
                --line: rgba(100, 77, 37, 0.35);
                --shadow: rgba(48, 39, 24, 0.18);
            }

            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                min-height: 100%;
            }
            body {
                background: var(--bg);
                color: var(--fg);
                font-family: var(--mono);
                overflow: hidden;
            }

            #deck {
                position: relative;
                width: 100vw;
                height: 100vh;
            }
            .slide {
                position: absolute;
                inset: 0;
                display: none;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 6vh 8vw;
                text-align: center;
            }
            .slide.active {
                display: flex;
            }
            .slide.with-image {
                padding: 4vh 5vw;
            }

            .kicker {
                margin-bottom: 2.2vh;
                color: var(--accent);
                font-size: clamp(0.7rem, 1.2vw, 1rem);
                letter-spacing: 0.25em;
                text-transform: uppercase;
            }
            .main {
                max-width: 68rem;
                font-size: clamp(1.4rem, 3.5vw, 3.1rem);
                font-weight: 400;
                letter-spacing: -0.02em;
                line-height: 1.4;
            }
            .main.quote::before {
                content: "“";
            }
            .main.quote::after {
                content: "”";
            }
            .sub {
                max-width: 50rem;
                margin-top: 3vh;
                color: var(--muted);
                font-size: clamp(0.78rem, 1.15vw, 1.02rem);
                line-height: 1.65;
            }
            .attrib {
                margin-top: 2vh;
                color: var(--muted);
                font-size: clamp(0.8rem, 1.1vw, 1.05rem);
                letter-spacing: 0.03em;
            }
            .title .main {
                font-size: clamp(1.7rem, 4.4vw, 4rem);
                font-weight: 700;
            }
            .title .main::after {
                margin-left: 0.1em;
                color: var(--accent);
                content: "\2588";
                animation: blink 1.1s step-end infinite;
            }
            .portrait {
                width: clamp(6rem, 12vw, 9rem);
                height: clamp(6rem, 12vw, 9rem);
                margin-bottom: 2vh;
                border: 2px solid var(--accent);
                border-radius: 50%;
                object-fit: cover;
                object-position: top center;
            }
            .image {
                width: auto;
                max-width: min(86vw, 72rem);
                height: auto;
                max-height: 54vh;
                margin-top: 3vh;
                border: 1px solid var(--line);
                border-radius: 6px;
                box-shadow: 0 1.2rem 3rem var(--shadow);
            }
            .link {
                margin-top: 2.4vh;
                font-size: clamp(0.75rem, 1vw, 0.95rem);
            }
            .link a {
                color: var(--accent);
                text-decoration: none;
                border-bottom: 1px solid var(--line);
            }
            .link a:hover {
                border-bottom-color: var(--accent);
            }

            #progress {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 0;
                height: 3px;
                background: var(--accent);
                transition: width 0.2s ease;
            }
            #act-tag,
            #hint,
            #counter,
            #theme-toggle {
                position: fixed;
                color: var(--muted);
                font-size: 0.75rem;
            }
            #act-tag {
                top: 1rem;
                left: 1.2rem;
                letter-spacing: 0.15em;
                opacity: 0.75;
                text-transform: uppercase;
            }
            #hint {
                bottom: 1rem;
                left: 1.2rem;
                opacity: 0.65;
            }
            #counter {
                right: 5.8rem;
                bottom: 1rem;
            }
            #theme-toggle {
                right: 1.2rem;
                bottom: 0.62rem;
                padding: 0.35rem 0.55rem;
                border: 1px solid var(--line);
                border-radius: 4px;
                background: transparent;
                color: var(--fg);
                font: inherit;
                font-size: 0.72rem;
                cursor: pointer;
            }
            #theme-toggle:hover,
            #theme-toggle:focus-visible {
                border-color: var(--accent);
                color: var(--accent);
                outline: none;
            }
            @keyframes blink {
                50% {
                    opacity: 0;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .title .main::after {
                    animation: none;
                }
            }
            @media (max-width: 560px) {
                #hint {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <main id="deck" aria-live="polite"></main>
        <div id="progress"></div>
        <div id="act-tag"></div>
        <div id="hint">← → space · f fullscreen · t theme</div>
        <div id="counter"></div>
        <button
            id="theme-toggle"
            type="button"
            aria-label="Switch to light theme"
        >
            Light
        </button>

        <script>
            /*
      REUSABLE CONTENT AREA

      To build a new presentation, only edit the `slides` array below.
      Each object can use: act, kicker, main, sub, attrib, quote, title,
      portrait, image, imageAlt, link, and linkText.

      `main`, `sub`, and `attrib` accept <br> for intentional line breaks.
      `image` and `portrait` can be a URL, a local relative file path, or a data URL.
    */
            const presentation = {
                title: "The Computer Used to Obey You",
                defaultTheme: "dark", // Change to "light" if preferred.
            };

            const slides = [
                {
                    title: true,
                    main: "The Computer<br>Used to Obey You",
                    sub: "Freedom, ownership, and AI — who owns the internet, and what to do about it.",
                },
                {
                    act: "Cold Open",
                    title: false,
                    kicker: "A question",
                    main: "Who controls the machine?",
                    sub: "Replace this slide and add as many more objects as you need.",
                },
                {
                    act: "Act I · Example",
                    kicker: "A quote",
                    main: "The computer should work for its owner.",
                    quote: true,
                    attrib: "— Your source",
                    portrait:
                        "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=400&q=80",
                    link: "https://example.com",
                    linkText: "Read the source",
                },
                {
                    act: "Act II · Example",
                    kicker: "An image",
                    main: "A slide can include a full image.",
                    image: "https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1400&q=80",
                    imageAlt: "A bright workspace",
                    sub: "Use a local image path such as images/example.jpg if you keep images beside this file.",
                },
                { title: true, main: "Thank you.", sub: "Questions?" },
            ];

            document.title = `${presentation.title} — Slides`;
            const root = document.documentElement;
            const deck = document.querySelector("#deck");
            const progress = document.querySelector("#progress");
            const counter = document.querySelector("#counter");
            const actTag = document.querySelector("#act-tag");
            const themeButton = document.querySelector("#theme-toggle");
            let currentSlide = 0;

            function applyTheme(theme) {
                root.dataset.theme = theme;
                themeButton.textContent = theme === "dark" ? "Light" : "Dark";
                themeButton.setAttribute(
                    "aria-label",
                    `Switch to ${theme === "dark" ? "light" : "dark"} theme`,
                );
                localStorage.setItem("slide-theme", theme);
            }

            function toggleTheme() {
                applyTheme(root.dataset.theme === "dark" ? "light" : "dark");
            }

            function render() {
                const slide = slides[currentSlide];
                const element = document.createElement("section");
                element.className = `slide active${slide.title ? " title" : ""}${slide.image ? " with-image" : ""}`;
                element.setAttribute("aria-label", `Slide ${currentSlide + 1}`);
                element.innerHTML = `
        ${slide.portrait ? `<img class="portrait" src="${slide.portrait}" alt="">` : ""}
        ${slide.kicker ? `<div class="kicker">${slide.kicker}</div>` : ""}
        <div class="main${slide.quote ? " quote" : ""}">${slide.main || ""}</div>
        ${slide.attrib ? `<div class="attrib">${slide.attrib}</div>` : ""}
        ${slide.image ? `<img class="image" src="${slide.image}" alt="${slide.imageAlt || ""}">` : ""}
        ${slide.sub ? `<div class="sub">${slide.sub}</div>` : ""}
        ${slide.link ? `<div class="link">▶ <a href="${slide.link}" target="_blank" rel="noopener noreferrer">${slide.linkText || "Open link"}</a></div>` : ""}
      `;
                deck.replaceChildren(element);
                progress.style.width = `${((currentSlide + 1) / slides.length) * 100}%`;
                counter.textContent = `${currentSlide + 1} / ${slides.length}`;
                actTag.textContent = slide.act || "";
            }

            function next() {
                if (currentSlide < slides.length - 1) {
                    currentSlide += 1;
                    render();
                }
            }
            function previous() {
                if (currentSlide > 0) {
                    currentSlide -= 1;
                    render();
                }
            }

            document.addEventListener("keydown", (event) => {
                if (
                    ["ArrowRight", "ArrowDown", "PageDown", " "].includes(
                        event.key,
                    )
                ) {
                    event.preventDefault();
                    next();
                } else if (
                    ["ArrowLeft", "ArrowUp", "PageUp"].includes(event.key)
                ) {
                    event.preventDefault();
                    previous();
                } else if (event.key === "Home") {
                    currentSlide = 0;
                    render();
                } else if (event.key === "End") {
                    currentSlide = slides.length - 1;
                    render();
                } else if (event.key.toLowerCase() === "f") {
                    document.fullscreenElement
                        ? document.exitFullscreen()
                        : document.documentElement.requestFullscreen();
                } else if (event.key.toLowerCase() === "t") {
                    toggleTheme();
                }
            });

            deck.addEventListener("click", (event) =>
                event.clientX < window.innerWidth / 2 ? previous() : next(),
            );
            themeButton.addEventListener("click", (event) => {
                event.stopPropagation();
                toggleTheme();
            });

            applyTheme(
                localStorage.getItem("slide-theme") ||
                    presentation.defaultTheme,
            );
            render();
        </script>
    </body>
</html>
