<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <title>My Presentations</title>
    </head>

    <body class="min-h-screen bg-[#282828] text-[#ebdbb2]">
        <main
            class="mx-auto min-h-screen max-w-6xl border-x border-[#504945] px-5 sm:px-8"
        >
            <header
                class="flex items-center justify-between border-b border-[#504945] py-5"
            >
                <a
                    href="#"
                    class="text-lg font-bold tracking-tight text-[#fabd2f] transition-colors hover:text-[#fe8019]"
                >
                    My Presentations
                </a>

                <nav
                    aria-label="Main navigation"
                    class="flex gap-5 text-sm text-[#a89984]"
                >
                    <a
                        href="#presentations"
                        class="transition-colors hover:text-[#fabd2f]"
                    >
                        Presentations
                    </a>
                    <a
                        href="#about"
                        class="transition-colors hover:text-[#fabd2f]"
                    >
                        About
                    </a>
                </nav>
            </header>

            <section id="about" class="py-16 sm:py-24">
                <p class="mb-3 text-sm font-medium text-[#b8bb26]">
                    A collection of my work
                </p>

                <h1
                    class="max-w-2xl text-4xl font-bold tracking-tight text-[#fbf1c7] sm:text-6xl"
                >
                    My presentations.
                </h1>

                <p class="mt-5 max-w-xl text-lg leading-8 text-[#a89984]">
                    A selection of presentations I’ve created, used, or plan to
                    share.
                </p>
            </section>

            <section id="presentations" class="pb-16">
                <div class="mb-6">
                    <h2 class="text-2xl font-semibold tracking-tight text-[#fbf1c7]">
                        Presentations
                    </h2>
                    <p class="mt-1 text-sm text-[#928374]">
                        Browse the collection
                    </p>
                </div>

                <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
                    <a
                        href="2026-do-computers-still-obey-us/slides.html"
                        class="group block rounded-md focus:outline-none focus-visible:ring-2 focus-visible:ring-[#fabd2f]"
                    >
                        <article
                            class="overflow-hidden rounded-md border border-[#504945] bg-[#32302f] transition duration-200 group-hover:-translate-y-1 group-hover:border-[#d79921] group-hover:shadow-lg group-hover:shadow-black/20"
                        >
                            <img
                                src="https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=900&q=80"
                                alt="A team collaborating around a table"
                                class="h-48 w-full object-cover opacity-80 transition group-hover:opacity-100"
                            />

                            <div class="p-5">
                                <p
                                    class="text-xs font-medium uppercase tracking-wider text-[#fe8019]"
                                >
                                    Presentation
                                </p>

                                <h3
                                    class="mt-2 text-lg font-semibold text-[#fbf1c7] transition-colors group-hover:text-[#fabd2f]"
                                >
                                    Testing
                                </h3>

                                <p class="mt-2 text-sm leading-6 text-[#a89984]">
                                    Testing presentation on the GitHub Pages
                                </p>

                                <span
                                    class="mt-4 inline-block text-sm font-medium text-[#b8bb26]"
                                >
                                    View presentation
                                    <span aria-hidden="true">→</span>
                                </span>
                            </div>
                        </article>
                    </a>
                </div>
            </section>
        </main>
    </body>
</html>
