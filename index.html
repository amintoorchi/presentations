<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <title>My Presentations</title>
    </head>

    <body class="min-h-screen bg-white text-zinc-900">
        <main
            class="mx-auto min-h-screen max-w-6xl border-x border-zinc-200 px-5 sm:px-8"

            <header
                class="flex items-center justify-between border-b border-zinc-200 py-5"

                <a href="#" class="text-lg font-bold tracking-tight"

                <nav

                    >
                    <a href="#about" class="hover:text-zinc-950">About</a>

            <section id="about" class="py-16 sm:py-24">

                </p>
                <h1

                    My presentations.

                    share.
                </p>
            </section>

            <section id="presentations" class="pb-16">
                <div class="mb-6 flex items-end justify-between">

                            <img

                                class="h-48 w-full object-cover"

                            <div class="p-5">
                                <p
                                    class="text-xs font-medium uppercase tracking-wider text-zinc-500"
                                >
                                    Presentation
                                </p>
                                <h3 class="mt-2 text-lg font-semibold">
                                    Testing
